name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependances
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache patch
          pip install buildozer==1.5.0 cython==0.29.36
      - name: Compilation
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Resume des erreurs
        if: failure()
        run: grep -n -i -E "error|fatal|traceback|not found" build.log | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: foot-v6-apk
          path: bin/*.apk
